name: Commit hotfix dist

on:
  push:
    branches: ["hotfix/v0.12.1-tuplevalue-collision"]

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.12.1-tuplevalue-collision
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - name: Commit compiled dist
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build v0.12.1 hotfix dist"
          git push origin HEAD:hotfix/v0.12.1-tuplevalue-collision
