name: Dist Sync Temp

on:
  push:
    branches: ["fix/v0.13.9-fail-open-model-patch"]

permissions:
  contents: write

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.13.9-fail-open-model-patch
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build and test
        run: npm test
      - name: Commit generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist already current"
            exit 0
          fi
          git commit -m "Rebuild dist for v0.13.9"
          git push origin HEAD:fix/v0.13.9-fail-open-model-patch
