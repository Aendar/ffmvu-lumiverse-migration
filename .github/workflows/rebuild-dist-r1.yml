name: Rebuild dist R1

on:
  push:
    branches: ["fix/r1-unbound-committed-attempt"]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/r1-unbound-committed-attempt
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Rebuild dist
        run: npm run build
      - name: Commit generated dist if changed
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Rebuild final dist for v0.13.10"
          git push origin HEAD:fix/r1-unbound-committed-attempt
