name: Temporary equipment reconciliation sync

on:
  push:
    branches:
      - codex/backend-optimization-phase1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[equipment-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/backend-optimization-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply equipment reconciliation
        run: node scripts/apply-equipment-reconciliation.mjs
      - name: Validate source, build and tests
        run: npm test
      - name: Remove temporary migration machinery
        run: |
          rm scripts/apply-equipment-reconciliation.mjs
          rm .github/workflows/temp-equipment-reconcile-sync.yml
      - name: Commit source and tracked dist
        run: |
          git config user.name "Aendar"
          git config user.email "96650425+Aendar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[equipment-sync] Apply atomic equipment reconciliation"
          git push origin HEAD:codex/backend-optimization-phase1
