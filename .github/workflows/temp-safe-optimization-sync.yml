name: Temporary safe optimization sync

on:
  push:
    branches:
      - codex/backend-optimization-phase1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[safe-opt-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/backend-optimization-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply guarded source edits
        run: node scripts/apply-safe-optimization-slices.mjs
      - name: Validate source, build and tests
        run: npm test
      - name: Remove temporary migration machinery
        run: |
          rm scripts/apply-safe-optimization-slices.mjs
          rm .github/workflows/temp-safe-optimization-sync.yml
      - name: Commit source and tracked dist
        run: |
          git config user.name "Aendar"
          git config user.email "96650425+Aendar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[safe-opt-sync] Apply backend optimization slices"
          git push origin HEAD:codex/backend-optimization-phase1
