name: TEMP import v0.13.23 archive

on:
  push:
    branches: ["import/v0.13.23-archive"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Restore archive-only source files
        run: |
          cat             .tmp/v01323/part00             .tmp/v01323/part01             .tmp/v01323/fix_part02_*             .tmp/v01323/part03             .tmp/v01323/part04             .tmp/v01323/fix_part05_00a             .tmp/v01323/fix_part05_00b             .tmp/v01323/fix_part05_00c             .tmp/v01323/fix_part05_01             .tmp/v01323/fix_part05_02             .tmp/v01323/fix_part05_03             .tmp/v01323/fix_part05_04             .tmp/v01323/fix_part05_05             .tmp/v01323/fix_part05_06             .tmp/v01323/fix_part05_07             .tmp/v01323/fix_part06_*             .tmp/v01323/fix_part07_*             > /tmp/missing-v01323.tar.gz
          echo "c660f48e11c855437e3fc028ac580dbfdc8ef86872f94411c6b1adce2edfb743  /tmp/missing-v01323.tar.gz" | sha256sum -c -
          tar -xzf /tmp/missing-v01323.tar.gz
          rm -rf .tmp
      - name: Test and build
        run: npm test
      - name: Commit reconstructed v0.13.23 source and dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "archive already reconstructed"
            exit 0
          fi
          git commit -m "Import v0.13.23 archive"
          git push
